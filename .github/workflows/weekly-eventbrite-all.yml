# Manual full Eventbrite run — countries execute one after another.
name: Weekly Eventbrite (all countries sequential)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  saudi-arabia:
    uses: ./.github/workflows/trainings-eventbrite-reusable.yml
    with:
      scraper_key: eventbrite-sa
      country_label: Saudi Arabia
    secrets: inherit

  bahrain:
    needs: saudi-arabia
    uses: ./.github/workflows/trainings-eventbrite-reusable.yml
    with:
      scraper_key: eventbrite-bh
      country_label: Bahrain
    secrets: inherit

  qatar:
    needs: bahrain
    uses: ./.github/workflows/trainings-eventbrite-reusable.yml
    with:
      scraper_key: eventbrite-qa
      country_label: Qatar
    secrets: inherit

  oman:
    needs: qatar
    uses: ./.github/workflows/trainings-eventbrite-reusable.yml
    with:
      scraper_key: eventbrite-om
      country_label: Oman
    secrets: inherit

  germany:
    needs: oman
    uses: ./.github/workflows/trainings-eventbrite-reusable.yml
    with:
      scraper_key: eventbrite-de
      country_label: Germany
    secrets: inherit

  france:
    needs: germany
    uses: ./.github/workflows/trainings-eventbrite-reusable.yml
    with:
      scraper_key: eventbrite-fr
      country_label: France
    secrets: inherit

  czech-republic:
    needs: france
    uses: ./.github/workflows/trainings-eventbrite-reusable.yml
    with:
      scraper_key: eventbrite-cz
      country_label: Czech Republic
    secrets: inherit

  netherlands:
    needs: czech-republic
    uses: ./.github/workflows/trainings-eventbrite-reusable.yml
    with:
      scraper_key: eventbrite-nl
      country_label: Netherlands
    secrets: inherit

  canada:
    needs: netherlands
    uses: ./.github/workflows/trainings-eventbrite-reusable.yml
    with:
      scraper_key: eventbrite-ca
      country_label: Canada
    secrets: inherit

  japan:
    needs: canada
    uses: ./.github/workflows/trainings-eventbrite-reusable.yml
    with:
      scraper_key: eventbrite-jp
      country_label: Japan
    secrets: inherit

  malaysia:
    needs: japan
    uses: ./.github/workflows/trainings-eventbrite-reusable.yml
    with:
      scraper_key: eventbrite-my
      country_label: Malaysia
    secrets: inherit

  singapore:
    needs: malaysia
    uses: ./.github/workflows/trainings-eventbrite-reusable.yml
    with:
      scraper_key: eventbrite-sg
      country_label: Singapore
    secrets: inherit
